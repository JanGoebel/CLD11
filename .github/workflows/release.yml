# Runs when a version tag is pushed (git tag v1.0.0; git push origin v1.0.0):
# tests, builds the exe and publishes it as a GitHub release.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: [self-hosted, labview]
    permissions:
      contents: write                    # to create the release
    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (Caraya)
        run: .\tools\Run-Tests.ps1

      - name: Build exe
        run: .\tools\Build-Exe.ps1

      - name: Create GitHub release with the exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Rename-Item builds\ATM.zip "ATM-${{ github.ref_name }}.zip"
          gh release create ${{ github.ref_name }} "builds\ATM-${{ github.ref_name }}.zip" --generate-notes
